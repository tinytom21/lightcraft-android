org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Rust library's ABIs: arm64-v8a for phones, x86_64 for the emulator. Build one to save time,
# e.g. `./gradlew installDebug -Plightcraft.abis=arm64-v8a`.
lightcraft.abis=arm64-v8a,x86_64

# LightCraft Cloud's own version line (it began at 0.1.0; the Rust engine's 0.14.0 and upstream's
# 0.0.x releases are other lines). Version and version code go together (see app/build.gradle.kts, the
# build checks the two agree: ((major*100 + minor)*100 + patch)*100 + 99 for a release, + the number
# of a pre-release instead, so 0.1.0 is 10099 and 0.1.0-beta is 10001; the APK's own code is that times
# ten plus the ABI digit). To release: set both here, commit, and push the tag v<version>; the release
# workflow refuses a tag that differs.
lightcraft.version=0.1.0
lightcraft.versionCode=10099
